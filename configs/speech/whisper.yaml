# Whisper encoder → dialect classifier config
model: whisper_encoder_mlp
whisper_model: xezpeleta/whisper-large-v3-eu
pooling: mean_std_max       # mean_std_max (3840-dim, no re-extraction) or attention (num_segments × 1280, requires re-extraction)

input_dim: 3840             # automatically set based on pooling mode
num_segments: 8             # only used with pooling=attention
attention_dim: 256          # bottleneck dim for attention pooling
hidden_dim: 768
dropout: 0.3
num_layers: 2
num_classes: 5

# Loss function
loss: crossentropy
focal_gamma: 2.0

# Class balancing
balanced_subsample: 10000     # 0 = disabled, N = downsample each class to N samples
class_weights: false        # sklearn compute_class_weight('balanced')

# Training
batch_size: 64
learning_rate: 5e-4
epochs: 100
weight_decay: 1e-4
